# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO26-Micro: Kiến trúc siêu nhẹ tối ưu hóa riêng cho Robot Simulator Bệnh viện
# Tham số: 622,959 (0.62M) | FLOPs: 3.17 GFLOPs @ 640x640 | Dung lượng INT8: ~608 KB

nc: 17
scales:
  # [depth, width, max_channels]
  micro: [0.33, 0.18, 384]

scale: micro

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [48, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [96, 3, 2]]      # 1-P2/4
  - [-1, 1, C3k2, [192, False]]    # 2
  - [-1, 1, Conv, [192, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2, [384, False]]    # 4
  - [-1, 1, Conv, [384, 3, 2]]     # 5-P4/16
  - [-1, 2, C3k2, [384, True]]     # 6
  - [-1, 1, Conv, [384, 3, 2]]     # 7-P5/32
  - [-1, 1, C3k2, [384, True]]     # 8
  - [-1, 1, SPPF, [384, 5]]        # 9 (Đã bỏ C2PSA để tối ưu hóa triệt để)

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 1, C3k2, [384, False]]    # 12
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 1, C3k2, [192, False]]    # 15 (P3/8-small)
  - [-1, 1, Conv, [192, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]     # cat head P4
  - [-1, 1, C3k2, [384, False]]    # 18 (P4/16-medium)
  - [-1, 1, Conv, [384, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]      # cat head P5
  - [-1, 1, C3k2, [384, True]]     # 21 (P5/32-large)
  - [[15, 18, 21], 1, Detect, [nc]]# Detect(P3, P4, P5)
